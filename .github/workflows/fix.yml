name: Global ToolCode AI Debugger

on:
  workflow_run:
    # workflow_run uses workflow names, not a wildcard pattern.
    workflows:
      - Build
      - Compose Compiler Reports
      - PerfGuard
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: GitHub Actions Run ID to analyze
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  inspect-trigger:
    name: Inspect trigger
    runs-on: ubuntu-latest
    outputs:
      should_analyze: ${{ steps.gate.outputs.should_analyze }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
      TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}

    steps:
      - name: Show trigger context
        run: |
          set -Eeuo pipefail
          echo "Trigger event: $EVENT_NAME"
          echo "Workflow run ID: ${RUN_ID:-unknown}"
          echo "Workflow name: ${TRIGGER_WORKFLOW:-manual}"
          echo "Conclusion: ${TRIGGER_CONCLUSION:-manual}"

      - name: Decide whether to analyze
        id: gate
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual run requested; analyzing run $RUN_ID."
            echo "should_analyze=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TRIGGER_CONCLUSION" =~ ^(failure|cancelled|timed_out|startup_failure|action_required|stale)$ ]]; then
            echo "The triggering workflow ended with '$TRIGGER_CONCLUSION'; starting analysis."
            echo "should_analyze=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping analysis because the triggering workflow conclusion is '${TRIGGER_CONCLUSION:-unknown}'."
            echo "should_analyze=false" >> "$GITHUB_OUTPUT"
          fi

  analyze-and-fix:
    needs: inspect-trigger
    if: ${{ needs.inspect-trigger.outputs.should_analyze == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}

    steps:
      - name: Show trigger context
        run: |
          set -Eeuo pipefail
          echo "Trigger event: ${{ github.event_name }}"
          echo "Workflow run ID: $RUN_ID"
          echo "Workflow name: ${{ github.event.workflow_run.name || 'manual' }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion || 'manual' }}"

      - name: Initialize debugger workspace
        run: echo "WORK_DIR=$RUNNER_TEMP/toolcode-ai-fix" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # head_sha also works when the failed run came from a pull request.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download and clean failed logs
        id: get_logs
        run: |
          set -Eeuo pipefail
          mkdir -p "$WORK_DIR"
          GH_ERROR_FILE="$WORK_DIR/gh-error.log"
          : > "$GH_ERROR_FILE"

          echo "Fetching logs for repository $GITHUB_REPOSITORY, Run ID $RUN_ID..."

          if ! gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$WORK_DIR/raw_failed.log" 2> "$GH_ERROR_FILE"; then
            echo "::warning::Failed-log download failed; trying the complete run log."
          fi

          if [ ! -s "$WORK_DIR/raw_failed.log" ]; then
            echo "Failed-log output was empty; fetching the complete run log..."
            if ! gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log > "$WORK_DIR/raw_failed.log" 2>> "$GH_ERROR_FILE"; then
              echo "::error::Unable to download the triggering workflow logs."
              cat "$GH_ERROR_FILE" >&2
              exit 1
            fi
          fi

          if [ ! -s "$WORK_DIR/raw_failed.log" ]; then
            echo "::error::The triggering workflow returned no log content."
            cat "$GH_ERROR_FILE" >&2
            exit 1
          fi

          sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' \
            "$WORK_DIR/raw_failed.log" > "$WORK_DIR/clean_failed.log"
          tail -n 200 "$WORK_DIR/clean_failed.log" > "$WORK_DIR/build_error.log"

          echo "Captured $(wc -l < "$WORK_DIR/build_error.log") lines of error context."
          echo "--- failed workflow log excerpt ---"
          cat "$WORK_DIR/build_error.log"

      - name: Call ToolCode AI to fix bugs
        id: ai_fix
        env:
          TOOLCODE_API_KEY: ${{ secrets.TOOLCODE_API_KEY }}
        run: |
          set -Eeuo pipefail
          : "${TOOLCODE_API_KEY:?TOOLCODE_API_KEY secret is not configured}"
          test -s "$WORK_DIR/build_error.log"

          ERROR_LOG="$(< "$WORK_DIR/build_error.log")"
          TRACKED_FILES="$(git ls-files)"
          jq -n \
            --arg model "gpt-5.6-luna" \
            --arg error_log "$ERROR_LOG" \
            --arg tracked_files "$TRACKED_FILES" \
            '{
              model: $model,
              messages: [{
                role: "user",
                content: ("The CI workflow failed. Analyze this error log and return the complete corrected file content.\n--- error log ---\n" + $error_log + "\n--- tracked files ---\n" + $tracked_files + "\n--- instructions ---\nChoose file_path only from the tracked files list. If no safe, actionable file can be identified, return null for both file_path and fixed_content. Return only a JSON object with this exact shape: {\"file_path\":\"relative/path or null\",\"fixed_content\":\"complete file content or null\"}.")
              }],
              response_format: {type: "json_object"}
            }' > "$WORK_DIR/request.json"

          echo "Calling ToolCode AI..."
          set +e
          HTTP_CODE="$(curl \
            --location \
            --silent \
            --show-error \
            --fail-with-body \
            --connect-timeout 20 \
            --max-time 180 \
            --request POST "https://toolcode.top/v1/chat/completions" \
            --header "Authorization: Bearer $TOOLCODE_API_KEY" \
            --header "Content-Type: application/json" \
            --data-binary "@$WORK_DIR/request.json" \
            --output "$WORK_DIR/ai_http_response.json" \
            --write-out '%{http_code}')"
          CURL_EXIT=$?
          set -e

          echo "ToolCode HTTP status: ${HTTP_CODE:-unknown}"
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::ToolCode API request failed with curl exit code $CURL_EXIT."
            cat "$WORK_DIR/ai_http_response.json" >&2 || true
            exit "$CURL_EXIT"
          fi

          if ! jq -e . "$WORK_DIR/ai_http_response.json" >/dev/null; then
            echo "::error::ToolCode returned invalid JSON."
            cat "$WORK_DIR/ai_http_response.json"
            exit 1
          fi

          if ! jq -e '.choices[0].message.content | type == "string"' "$WORK_DIR/ai_http_response.json" >/dev/null; then
            echo "::error::ToolCode response does not contain choices[0].message.content."
            cat "$WORK_DIR/ai_http_response.json"
            exit 1
          fi

          # The first choices element is the standard chat-completions response shape.
          jq -r '.choices[0].message.content' "$WORK_DIR/ai_http_response.json" > "$WORK_DIR/ai_response.json"
          echo "--- ToolCode response ---"
          cat "$WORK_DIR/ai_response.json"

      - name: Apply AI fix
        id: apply
        run: |
          set -Eeuo pipefail
          RESPONSE_FILE="$WORK_DIR/ai_response.json"

          if ! jq -e 'type == "object" and (.file_path | type == "string" and length > 0 and . != "null") and (.fixed_content | type == "string" and length > 0 and . != "null")' "$RESPONSE_FILE" >/dev/null; then
            echo "::warning::AI response does not contain an actionable file fix; skipping file update."
            cat "$RESPONSE_FILE"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILE_PATH="$(jq -r '.file_path' "$RESPONSE_FILE")"
          FIXED_CONTENT="$(jq -r '.fixed_content' "$RESPONSE_FILE")"

          case "$FILE_PATH" in
            /*|../*|*/../*|.github/workflows/fix.yml)
              echo "::error::Refusing unsafe or protected file path: $FILE_PATH"
              exit 1
              ;;
          esac

          if ! git ls-files --error-unmatch -- "$FILE_PATH" >/dev/null 2>&1; then
            echo "::warning::AI selected an untracked file; skipping file update: $FILE_PATH"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "$FIXED_CONTENT" > "$FILE_PATH"
          echo "ToolCode AI updated: $FILE_PATH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request with fix
        if: steps.apply.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          commit-message: "fix(ai): automatically fix failed workflow"
          title: "[AI auto-fix] ${{ github.event.workflow_run.name || 'manual run' }}"
          body: |
            The triggering workflow failed and ToolCode AI generated a proposed fix.

            Please review the changed file before merging.
          branch: toolcode-ai-fix-${{ inputs.run_id || github.event.workflow_run.id }}
          delete-branch: true

      - name: Upload debugger logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolcode-debug-logs-${{ inputs.run_id || github.event.workflow_run.id }}
          path: ${{ runner.temp }}/toolcode-ai-fix/*.log
          if-no-files-found: warn
          retention-days: 7
