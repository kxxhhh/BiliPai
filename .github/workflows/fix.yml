name: Global ToolCode AI Debugger

on:
  workflow_run:
    # workflow_run uses workflow names, not a wildcard pattern.
    workflows:
      - Build
      - Compose Compiler Reports
      - PerfGuard
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: GitHub Actions Run ID to analyze
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  inspect-trigger:
    name: Inspect trigger
    runs-on: ubuntu-latest
    outputs:
      should_analyze: ${{ steps.gate.outputs.should_analyze }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
      TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}

    steps:
      - name: Show trigger context
        run: |
          set -Eeuo pipefail
          echo "Trigger event: $EVENT_NAME"
          echo "Workflow run ID: ${RUN_ID:-unknown}"
          echo "Workflow name: ${TRIGGER_WORKFLOW:-manual}"
          echo "Conclusion: ${TRIGGER_CONCLUSION:-manual}"

      - name: Decide whether to analyze
        id: gate
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual run requested; analyzing run $RUN_ID."
            echo "should_analyze=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TRIGGER_CONCLUSION" =~ ^(failure|cancelled|timed_out|startup_failure|action_required|stale)$ ]]; then
            echo "The triggering workflow ended with '$TRIGGER_CONCLUSION'; starting analysis."
            echo "should_analyze=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping analysis because the triggering workflow conclusion is '${TRIGGER_CONCLUSION:-unknown}'."
            echo "should_analyze=false" >> "$GITHUB_OUTPUT"
          fi

  analyze-and-fix:
    needs: inspect-trigger
    if: ${{ needs.inspect-trigger.outputs.should_analyze == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}

    steps:
      - name: Show trigger context
        run: |
          set -Eeuo pipefail
          echo "Trigger event: ${{ github.event_name }}"
          echo "Workflow run ID: $RUN_ID"
          echo "Workflow name: ${{ github.event.workflow_run.name || 'manual' }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion || 'manual' }}"

      - name: Initialize debugger workspace
        run: echo "WORK_DIR=$RUNNER_TEMP/toolcode-ai-fix" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # head_sha also works when the failed run came from a pull request.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download and clean failed logs
        id: get_logs
        run: |
          set -Eeuo pipefail
          mkdir -p "$WORK_DIR"
          GH_ERROR_FILE="$WORK_DIR/gh-error.log"
          : > "$GH_ERROR_FILE"

          echo "Fetching logs for repository $GITHUB_REPOSITORY, Run ID $RUN_ID..."

          if ! gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$WORK_DIR/raw_failed.log" 2> "$GH_ERROR_FILE"; then
            echo "::warning::Failed-log download failed; trying the complete run log."
          fi

          if [ ! -s "$WORK_DIR/raw_failed.log" ]; then
            echo "Failed-log output was empty; fetching the complete run log..."
            if ! gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log > "$WORK_DIR/raw_failed.log" 2>> "$GH_ERROR_FILE"; then
              echo "::warning::Unable to download logs for the triggering workflow; skipping AI analysis."
              cat "$GH_ERROR_FILE" >&2
              echo "has_logs=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ ! -s "$WORK_DIR/raw_failed.log" ]; then
            echo "::warning::The triggering workflow returned no log content; skipping AI analysis."
            cat "$GH_ERROR_FILE" >&2
            echo "has_logs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_logs=true" >> "$GITHUB_OUTPUT"
          sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' \
            "$WORK_DIR/raw_failed.log" > "$WORK_DIR/clean_failed.log"
          tail -n 200 "$WORK_DIR/clean_failed.log" > "$WORK_DIR/build_error.log"

          echo "Captured $(wc -l < "$WORK_DIR/build_error.log") lines of error context."
          echo "--- failed workflow log excerpt ---"
          cat "$WORK_DIR/build_error.log"

      - name: Call ToolCode AI to fix bugs
        id: ai_fix
        if: steps.get_logs.outputs.has_logs == 'true'
        env:
          TOOLCODE_API_KEY: ${{ secrets.TOOLCODE_API_KEY }}
        run: |
          set -Eeuo pipefail
          : "${TOOLCODE_API_KEY:?TOOLCODE_API_KEY secret is not configured}"
          test -s "$WORK_DIR/build_error.log"

          normalize_ai_response() {
            local input_file="$1"
            local output_file="$2"
            python3 - "$input_file" "$output_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          input_path, output_path = sys.argv[1:3]
          text = Path(input_path).read_text(encoding="utf-8")
          decoder = json.JSONDecoder()
          candidates = []
          index = 0

          while index < len(text):
              try:
                  value, end = decoder.raw_decode(text, index)
              except json.JSONDecodeError:
                  index += 1
                  continue
              if isinstance(value, dict):
                  candidates.append(value)
              index = end

          selected = {"file_path": None, "fixed_content": None}
          for value in reversed(candidates):
              if "file_path" in value or "fixed_content" in value:
                  selected = {
                      "file_path": value.get("file_path"),
                      "fixed_content": value.get("fixed_content"),
                  }
                  break

          Path(output_path).write_text(
              json.dumps(selected, ensure_ascii=False),
              encoding="utf-8",
          )
          PY
          }

          git ls-files > "$WORK_DIR/tracked_files.txt"
          jq -n \
            --arg model "gpt-5.6-luna" \
            --rawfile error_log "$WORK_DIR/build_error.log" \
            --rawfile tracked_files "$WORK_DIR/tracked_files.txt" \
            '{
              model: $model,
              messages: [{
                role: "user",
                content: ("The CI workflow failed. Analyze this error log and return the complete corrected file content.\n--- error log ---\n" + $error_log + "\n--- tracked files ---\n" + $tracked_files + "\n--- instructions ---\nChoose file_path only from the tracked files list. If no safe, actionable file can be identified, return null for both file_path and fixed_content. Return only a JSON object with this exact shape: {\"file_path\":\"relative/path or null\",\"fixed_content\":\"complete file content or null\"}.")
              }],
              response_format: {type: "json_object"}
            }' > "$WORK_DIR/request.json"

          echo "Calling ToolCode AI..."
          set +e
          HTTP_CODE="$(curl \
            --location \
            --silent \
            --show-error \
            --fail-with-body \
            --connect-timeout 20 \
            --max-time 180 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            --request POST "https://toolcode.top/v1/chat/completions" \
            --header "Authorization: Bearer $TOOLCODE_API_KEY" \
            --header "Content-Type: application/json" \
            --data-binary "@$WORK_DIR/request.json" \
            --output "$WORK_DIR/ai_http_response.json" \
            --write-out '%{http_code}')"
          CURL_EXIT=$?
          set -e

          echo "ToolCode HTTP status: ${HTTP_CODE:-unknown}"
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::ToolCode API request failed with curl exit code $CURL_EXIT."
            cat "$WORK_DIR/ai_http_response.json" >&2 || true
            exit "$CURL_EXIT"
          fi

          if ! jq -e . "$WORK_DIR/ai_http_response.json" >/dev/null; then
            echo "::error::ToolCode returned invalid JSON."
            cat "$WORK_DIR/ai_http_response.json"
            exit 1
          fi

          if ! jq -e '.choices[0].message.content | type == "string"' "$WORK_DIR/ai_http_response.json" >/dev/null; then
            echo "::error::ToolCode response does not contain choices[0].message.content."
            cat "$WORK_DIR/ai_http_response.json"
            exit 1
          fi

          # The first choices element is the standard chat-completions response shape.
          jq -r '.choices[0].message.content' "$WORK_DIR/ai_http_response.json" > "$WORK_DIR/ai_raw_response.txt"
          normalize_ai_response "$WORK_DIR/ai_raw_response.txt" "$WORK_DIR/ai_response.json"

          if ! jq -e 'type == "object" and (.file_path | type == "string" and length > 0 and . != "null") and (.fixed_content | type == "string" and length > 0 and . != "null")' "$WORK_DIR/ai_response.json" >/dev/null; then
            CANDIDATE_PATH="$(jq -r 'if type == "object" and (.file_path | type == "string") then .file_path else "" end' "$WORK_DIR/ai_response.json" 2>/dev/null || true)"

            if [[ -z "$CANDIDATE_PATH" || "$CANDIDATE_PATH" == "null" ]]; then
              CANDIDATE_PATH="$(while IFS= read -r tracked_file; do
                if grep -Fq -- "$tracked_file" "$WORK_DIR/build_error.log"; then
                  printf '%s\n' "$tracked_file"
                  break
                fi
              done < "$WORK_DIR/tracked_files.txt")"
            fi

            if [[ -z "$CANDIDATE_PATH" || "$CANDIDATE_PATH" == "null" ]]; then
              CANDIDATE_PATH="$(while IFS= read -r tracked_file; do
                file_name="${tracked_file##*/}"
                file_stem="${file_name%.*}"
                if (( ${#file_stem} >= 8 )) && grep -Fq -- "$file_stem" "$WORK_DIR/build_error.log"; then
                  printf '%s\n' "$tracked_file"
                  break
                fi
              done < "$WORK_DIR/tracked_files.txt")"
            fi

            if [[ -z "$CANDIDATE_PATH" || "$CANDIDATE_PATH" == "null" ]]; then
              echo "::warning::Neither ToolCode nor the error log identified an actionable tracked file; skipping source-aware retry."
            else
              echo "Using log-matched tracked file for source-aware retry: $CANDIDATE_PATH"
              case "$CANDIDATE_PATH" in
                /*|../*|*/../*|.github/workflows/fix.yml)
                  echo "::warning::ToolCode selected an unsafe or protected file; skipping source-aware retry: $CANDIDATE_PATH"
                  ;;
                *)
                  if ! git ls-files --error-unmatch -- "$CANDIDATE_PATH" >/dev/null 2>&1; then
                    echo "::warning::ToolCode selected an untracked file; skipping source-aware retry: $CANDIDATE_PATH"
                  else
                    jq -n \
                      --arg model "gpt-5.6-luna" \
                      --arg file_path "$CANDIDATE_PATH" \
                      --rawfile error_log "$WORK_DIR/build_error.log" \
                      --rawfile source_content "$CANDIDATE_PATH" \
                      '{
                        model: $model,
                        messages: [{
                          role: "user",
                          content: ("The CI workflow failed. Fix the tracked file named in file_path. Preserve unrelated content and return the complete corrected file.\n--- file_path ---\n" + $file_path + "\n--- current source ---\n" + $source_content + "\n--- error log ---\n" + $error_log + "\n--- instructions ---\nReturn only a JSON object with this exact shape: {\"file_path\":\"" + $file_path + "\",\"fixed_content\":\"complete corrected file content\"}. Do not return null or markdown.")
                        }],
                        response_format: {type: "json_object"}
                      }' > "$WORK_DIR/source_request.json"

                    echo "Calling ToolCode AI with the selected source file..."
                    set +e
                    RETRY_HTTP_CODE="$(curl \
                      --location \
                      --silent \
                      --show-error \
                      --fail-with-body \
                      --connect-timeout 20 \
                      --max-time 180 \
                      --retry 2 \
                      --retry-delay 5 \
                      --retry-all-errors \
                      --request POST "https://toolcode.top/v1/chat/completions" \
                      --header "Authorization: Bearer $TOOLCODE_API_KEY" \
                      --header "Content-Type: application/json" \
                      --data-binary "@$WORK_DIR/source_request.json" \
                      --output "$WORK_DIR/ai_source_http_response.json" \
                      --write-out '%{http_code}')"
                    RETRY_CURL_EXIT=$?
                    set -e

                    echo "ToolCode source-aware HTTP status: ${RETRY_HTTP_CODE:-unknown}"
                    if [ "$RETRY_CURL_EXIT" -ne 0 ]; then
                      echo "::warning::Source-aware ToolCode request failed with curl exit code $RETRY_CURL_EXIT; keeping the initial response and skipping this fix."
                      cat "$WORK_DIR/ai_source_http_response.json" >&2 || true
                    else
                      if ! jq -e . "$WORK_DIR/ai_source_http_response.json" >/dev/null; then
                        echo "::warning::Source-aware ToolCode returned invalid JSON; keeping the initial response."
                        cat "$WORK_DIR/ai_source_http_response.json"
                      elif ! jq -e '.choices[0].message.content | type == "string"' "$WORK_DIR/ai_source_http_response.json" >/dev/null; then
                        echo "::warning::Source-aware ToolCode response has no message content; keeping the initial response."
                        cat "$WORK_DIR/ai_source_http_response.json"
                      else
                        jq -r '.choices[0].message.content' "$WORK_DIR/ai_source_http_response.json" > "$WORK_DIR/ai_raw_source_response.txt"
                        normalize_ai_response "$WORK_DIR/ai_raw_source_response.txt" "$WORK_DIR/ai_response.json"
                      fi
                    fi
                  fi
                  ;;
              esac
            fi
          fi

          echo "--- ToolCode response ---"
          cat "$WORK_DIR/ai_response.json"

      - name: Apply AI fix
        id: apply
        if: steps.get_logs.outputs.has_logs == 'true'
        run: |
          set -Eeuo pipefail
          RESPONSE_FILE="$WORK_DIR/ai_response.json"

          if ! jq -e 'type == "object" and (.file_path | type == "string" and length > 0 and . != "null") and (.fixed_content | type == "string" and length > 0 and . != "null")' "$RESPONSE_FILE" >/dev/null; then
            echo "::warning::AI response does not contain an actionable file fix; skipping file update."
            cat "$RESPONSE_FILE"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILE_PATH="$(jq -r '.file_path' "$RESPONSE_FILE")"
          FIXED_CONTENT="$(jq -r '.fixed_content' "$RESPONSE_FILE")"

          case "$FILE_PATH" in
            /*|../*|*/../*|.github/workflows/fix.yml)
              echo "::error::Refusing unsafe or protected file path: $FILE_PATH"
              exit 1
              ;;
          esac

          if ! git ls-files --error-unmatch -- "$FILE_PATH" >/dev/null 2>&1; then
            echo "::warning::AI selected an untracked file; skipping file update: $FILE_PATH"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "$FIXED_CONTENT" > "$FILE_PATH"
          echo "ToolCode AI updated: $FILE_PATH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request with fix
        if: steps.apply.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          commit-message: "fix(ai): automatically fix failed workflow"
          title: "[AI auto-fix] ${{ github.event.workflow_run.name || 'manual run' }}"
          body: |
            The triggering workflow failed and ToolCode AI generated a proposed fix.

            Please review the changed file before merging.
          branch: toolcode-ai-fix-${{ inputs.run_id || github.event.workflow_run.id }}
          delete-branch: true

      - name: Upload debugger logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolcode-debug-logs-${{ inputs.run_id || github.event.workflow_run.id }}
          path: ${{ runner.temp }}/toolcode-ai-fix/*.log
          if-no-files-found: warn
          retention-days: 7
