name: Build, AI Heal & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 支持在 GitHub 后台手动点击触发

permissions:
  contents: write # 允许 Action 自动提交修复代码并创建 Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Android SDK 36
        uses: android-actions/setup-android@v3

      - name: 4. Build Debug APK
        id: build_step
        continue-on-error: true # 失败不中断，交给 AI
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 5. 如果编译失败，呼叫 AI 自动修复
      - name: 5. AI Auto-Fixer Agent
        if: steps.build_step.outcome == 'failure'
        uses: casibase/ai-fix-action@main
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          openai_base_url: "https://toolcode.top/v1"
          model: "gpt-5.6-luna"

      # 6. AI 修复后重新编译验证
      - name: 6. Re-build After AI Fix
        if: steps.build_step.outcome == 'failure'
        run: |
          echo "🔄 AI 已修复，正在重新打包..."
          ./gradlew assembleDebug

      # 7. 生成动态版本号（基于当前日期与时间，例如 v2026.08.01-1800）
      - name: 7. Generate Version Tag
        id: tag
        run: |
          TAG_NAME="v$(date +'%Y.%m.%d-%H%M')"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG_NAME"

      # 8. 直接发布到 GitHub Releases 并上传 APK（不占用 git 仓库空间）
      - name: 8. Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Bili-Companion Automated Build ${{ steps.tag.outputs.tag_name }}"
          body: |
            🤖 本次构建由 GitHub Actions 自动生成。
            - 包含最新上游同步与自动化编译。
            - 如遇构建报错，已启用 AI 自愈机制进行实时修复。
          files: |
            app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
